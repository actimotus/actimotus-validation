# Dataset registry for the ActiMotus validation study.
#
# Each entry pins a HuggingFace dataset to an exact commit SHA. Pinning matters:
# har_children_2024-harth moved v1.0.0 -> v1.1.0 (corrected thigh orientation)
# partway through this study. SHAs resolved 2026-08-15.
#
# All published data is in the hub frame (x=up, y=right, z=forward). The pipeline
# converts to the frame acti-motus expects on load; see frames.hub_to_acti.

[lendt_adults]
hf_repo  = "josefheidler/har_adults_2024-lendt"
revision = "52c911ab718cb64d51cec386370aea51341f0b2e"
vendor   = "Sens"
thigh    = "acc"           # thigh only; already presented as anterior front-thigh
labels   = "lendt"
split_by = "condition"     # -> lendt_laboratory / lendt_free_living

[ntnu_children]
hf_repo  = "josefheidler/har_children_2024-harth"
revision = "fc5c6e4d5fa7e88c56a289e71b5199bba28cad75"   # v1.1.0
vendor   = "Other"
thigh    = "thigh_acc"
back     = "back_acc"
labels   = "ntnu"
filter   = { cohort = "td" }   # 46 typically-developing subjects, as in the paper

[ntnu_adults]
hf_repo  = "josefheidler/har_adults_2021-harth"
revision = "b894cc0f6b77eeec000d493edc1bfc0f27561a9a"
vendor   = "Other"
thigh    = "thigh_acc"
back     = "back_acc"
labels   = "ntnu"

[ntnu_older_adults]
hf_repo  = "josefheidler/har_older-adults_2023-harth"
revision = "f031eda034f6538277a8dc894bf37ae5e0a6663c"
vendor   = "Other"
thigh    = "thigh_acc"
back     = "back_acc"
labels   = "ntnu"

[ntnu_walking_speeds]
hf_repo  = "josefheidler/har_ws_adults_2025-harth"
revision = "02ca7fa4fdbefa26342b4c0b0f00e2d41da046bb"
vendor   = "Other"
thigh    = "thigh_acc"
back     = "back_acc"
labels   = "walking_speeds"
