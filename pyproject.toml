[project]
name = "actimotus-validation"
version = "1.0.1"
description = "Reproducibility package for the ActiMotus human activity recognition validation study"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "acti-motus==2.3.3",
    "pandas>=2.2",
    "pyarrow>=17",
    "huggingface-hub>=0.26",
    "altair>=5.5.0",
    "vl-convert-python>=1.8.0",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8.0"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actimotus_validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires network and full feature extraction"]
