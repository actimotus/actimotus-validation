[project]
name = "actimotus-validation"
version = "1.0.0"
description = "Reproducibility package for the ActiMotus human activity recognition validation study"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # RELEASE BLOCKER: this must become "acti-motus==2.3.3" from PyPI before
    # tagging v1.0.0. 2.3.3 is not published yet, so the local path source
    # below stands in. Remove [tool.uv.sources] at release time.
    "acti-motus>=2.3.2",
    "pandas>=2.2",
    "pyarrow>=17",
    "huggingface-hub>=0.26",
    "altair>=5.5.0",
    "vl-convert-python>=1.8.0",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
# TEMPORARY -- see the release blocker note above.
acti-motus = { path = "../acti-motus", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actimotus_validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires network and full feature extraction"]
